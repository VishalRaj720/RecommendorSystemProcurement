<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>BIS Assistant</title>
    <style>
      body {
        margin: 0;
        width: 320px;
        font-family: "Segoe UI", system-ui, sans-serif;
        font-size: 13px;
        background: #faf9f5;
        color: #1c1d1f;
      }
      main {
        padding: 12px;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 14px;
        font-family: Georgia, serif;
        color: #0a192f;
      }
      p {
        margin: 0 0 12px;
        font-size: 11px;
        color: #5c5850;
      }
      label {
        display: block;
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        margin-bottom: 4px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #d6d3d1;
        padding: 8px;
        font-family: Consolas, monospace;
        font-size: 12px;
      }
      button {
        margin-top: 10px;
        width: 100%;
        border: none;
        background: #0a192f;
        color: #faf9f5;
        padding: 8px;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        cursor: pointer;
      }
      #status {
        margin-top: 8px;
        font-size: 11px;
        color: #065f46;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>BIS Assistant</h1>
      <p>
        FastAPI base URL for the side panel. Use <strong>http://127.0.0.1:8000</strong> (uvicorn), not port
        <strong>8080</strong> (mock GeM static server).
      </p>
      <label for="api">API base URL</label>
      <input id="api" type="url" placeholder="http://127.0.0.1:8000" />
      <button type="button" id="save">Save</button>
      <p id="status"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
