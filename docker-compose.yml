services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: bis
      POSTGRES_PASSWORD: bis
      POSTGRES_DB: bis_recommend
    ports:
      - "5433:5432"
    volumes:
      - bis_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bis -d bis_recommend"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://bis:bis@db:5432/bis_recommend
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      BHASHINI_USER_ID: ${BHASHINI_USER_ID:-}
      BHASHINI_API_KEY: ${BHASHINI_API_KEY:-}
      BHASHINI_PIPELINE_ID: ${BHASHINI_PIPELINE_ID:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 300s
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  bis_pgdata:
